openapi: 3.0.3
info:
  title: Service2 API
  description: Serves a fixed catalog of scored records, and an internal control that switches between full and empty mode.
  version: 0.1.0
servers:
  - url: /
paths:
  /catalog:
    get:
      operationId: getCatalog
      summary: The catalog service2 currently serves (full or empty, by mode)
      responses:
        '200':
          description: The current catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
  /catalog-mode:
    put:
      operationId: setCatalogMode
      summary: Internal-only switch between full and empty catalog mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogModeUpdate'
      responses:
        '200':
          description: The mode now in effect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogModeState'
        '400':
          description: The requested mode is not recognized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Record:
      type: object
      required: [id, name, score]
      properties:
        id:
          type: integer
        name:
          type: string
        score:
          type: integer
    Catalog:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/Record'
    CatalogModeUpdate:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [full, empty]
    CatalogModeState:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [full, empty]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: HTTP or application error code
        message:
          type: string
          description: short human-readable label
        description:
          type: string
          description: detailed explanation
        moreInfo:
          type: string
          description: URI to documentation
